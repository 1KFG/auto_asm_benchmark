# Backbone truth-genome registry
# Schema: schema/genomes.schema.json
# Grounding: NCBI RefSeq/GenBank assembly queries, 2026-08-17.
# These are the host (truth/reference) genomes for Phase 1. Contaminant
# genomes are declared per-dataset in datasets/*.yaml.
# Genome ids are 3+3-letter mnemonics with no strain suffix (ADR-013).

schema_version: "1.0"

genomes:
  - id: yarlip
    species: "Yarrowia lipolytica"
    strain: "CLIB122"
    taxonomy:
      kingdom: Fungi
      phylum: Ascomycota
      class: Saccharomycetes
    archetype: "Yeast (T2T)"
    accession: "GCF_001761485.1"
    assembly_name: "ASM176148v1"
    assembly_level: "Complete Genome"
    contig_n50: 3629463
    total_length: 20500066
    notes: "T2T/completely assembled yeast reference."

  - id: canaur
    species: "Candida auris"
    strain: "B11243"
    taxonomy:
      kingdom: Fungi
      phylum: Ascomycota
      class: Saccharomycetes
    archetype: "Yeast (T2T)"
    accession: "GCF_003013715.1"
    assembly_name: "ASM301371v2"
    assembly_level: "Complete Genome"
    contig_n50: 2336890
    total_length: 12249773
    notes: "Completed genome; opportunistic human pathogen."

  - id: aspfum
    species: "Aspergillus fumigatus"
    strain: "Af293"
    taxonomy:
      kingdom: Fungi
      phylum: Ascomycota
      class: Eurotiomycetes
    archetype: "Filamentous, moderate repeats"
    accession: "GCF_000002655.1"
    assembly_name: "ASM265v1"
    assembly_level: "Chromosome"
    contig_n50: 2460113
    total_length: 29384958
    alternatives:
      - id: aspfum_af1009b
        accession: "GCA_040126065.1"
        assembly_name: "UCR_Afum_AF100-9B_1.0"
        assembly_level: "Complete Genome"
        contig_n50: 3760025
        total_length: 28304265
        notes: "Lab T2T assembly; complete."
      - id: aspfum_cea10
        accession: "CEA10"
        notes: "PacBio data but NO Illumina. Optional long-read-only slot."
    notes: "CEA10 recorded as optional alt due to PacBio-only read support."

  - id: zymtri
    species: "Zymoseptoria tritici"
    strain: "IPO323"
    taxonomy:
      kingdom: Fungi
      phylum: Ascomycota
      class: Dothideomycetes
    archetype: "Heavy repeat / complex"
    accession: "GCF_000219625.1"
    assembly_name: "MYCGR v2.0"
    assembly_level: "Chromosome"
    contig_n50: 2665280
    total_length: 39686251
