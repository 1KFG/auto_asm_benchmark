    species: "Coprinopsis cinerea"
    strain: "CC3"
    accession: "GCF_000182895.1"
    assembly_level: "Contig"
    contig_n50: 3468139
    notes: "Well-validated 13-chromosome karyotype; cross-check, not primary truth."
  - id: ustmay
    species: "Ustilago maydis"
    strain: "521"
    accession: "GCF_000328475.2"
    assembly_level: "Chromosome"
    contig_n50: 129796
    notes: "Chromosome-level but fragmented at contig level; secondary."

excluded_note: "Puccinia spp. excluded for now (large/repetitive genomes); registry is extensible in future phases."

# Phase-2 expansion candidates (not yet resolved)
expansion_notes:
  - "Per-genome SRA verification of read-type availability (esp. DNBSEQ, HiFi for Agaricales/Mucoromycotina picks) is a required dataset-curation task."
