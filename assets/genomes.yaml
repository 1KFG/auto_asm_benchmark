    accession: "GCF_000149245.1"
    assembly_name: "CNA3"
    assembly_level: "Chromosome"
    contig_n50: 1422463
    total_length: 18891193
    notes: "Chromosome-level; rich SRA read-depth (short + long read)."

  - id: agabis
    species: "Agaricus bisporus"
    strain: "ASM5547079v1"
    taxonomy:
      kingdom: Fungi
      phylum: Basidiomycota
