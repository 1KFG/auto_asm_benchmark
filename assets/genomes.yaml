  - id: rhimic
    species: "Rhizopus microsporus"
    strain: "ATCC 52813"
    taxonomy:
      kingdom: Fungi
      phylum: Mucoromycota
      class: Mucoromycetes
    archetype: "Mucoromycotina (with Mycetohabitans endosymbiont)"
    accession: "GCF_002708625.1"
    assembly_name: "Rhimi1_1"
    assembly_level: "Scaffold"
    contig_n50: 69381
    total_length: 25972395
    notes: "Species reference genome (JGI, Illumina). STRAIN CAVEAT: the real-read work-unit rhimic_real_001 uses SRR9029155, a JGI RESEQUENCING of R. microsporus NRRL 5546, and no NRRL 5546 assembly is public; ATCC 52813 (GCF_002708625.1) is used as host truth with this documented strain mismatch. The Mycetohabitans sp. B46 symbiont (GCF_037389205.1) is the natural endosymbiont of NRRL 5546 (see ADR-016)."

auxiliary:
