# Canonical MpGAP param set (fmalmeida/MpGAP, pinned by commit in tool_matrix.yaml)
# MpGAP runs a YAML samplesheet through whichever assemblers apply to the
# given read types (spades/shovill/unicycler/megahit for illumina-only,
# canu/flye/raven/wtdbg2/shasta/hifiasm for long-read, more for hybrid) and
# publishes each one -- it does NOT auto-pick a single "best" assembly the
# way EGAP does. To keep our contract of one primary output per pipeline
# run, and to give a clean single-assembler comparison point against the
# other short-read pipelines here, the adapter skips every illumina
# assembler except spades by default.
pipeline: mpgap

params:
  organism: "fungus"     # bacteria | eukaryote | fungus -- changes QUAST/BUSCO gene-finding mode
  max_cpus: 8
  max_memory: "32.GB"

assemble:
  enable: ["spades"]     # subset of: spades, shovill, unicycler, megahit (illumina-only)

databases:
  busco_lineage: "fungi_odb10"
