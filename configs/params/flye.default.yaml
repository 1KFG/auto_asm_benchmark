# Canonical Flye long-read pipeline param set (HiFi / Nanopore)
# The adapter runs: fastplong trim -> flye (internal iterative polish) ->
# optional racon round -> AAFTF sourpurge/rmdup/sort (contig-level cleanup
# chain, same AAFTF subcommands the short-read pipeline uses -- they just
# take a FASTA, so they work regardless of which assembler produced it).
# No vecscreen: on whole-chromosome-scale HiFi contigs it dropped entire
# real host chromosomes as false-positive contamination (validated on
# cryneo_sim_contam_hi_001); sourpurge's taxonomy-based purge alone was
# clean on the same data.
pipeline: flye_pipeline
technology: long_read

trim:
  tool: fastplong          # fastp's long-read (ONT/PacBio) sibling tool
  min_length: 1000
  min_quality: 10          # -q; HiFi reads are already high-accuracy, this just drops outliers
  adapter_trimming: true   # fastplong auto-detects start/end adapters by default

assemble:
  tool: flye
  params:
    # --nano-raw for simplex ONT, --pacbio-hifi for HiFi, --nano-hq for Q20 ONT
    # the adapter overrides this per dataset from metadata.yaml's `technology`
    # field when present; this is the fallback.
    mode: "--pacbio-hifi"
    iterations: 2          # flye's own internal polishing rounds
    min_overlap: 5000
    meta: false             # single-genome assembly

polish:
  racon:
    enabled: true
    rounds: 1               # extra round on top of flye's internal iterations
    aligner: minimap2
  # medaka (ONT) and nextpolish are pinned in tool_matrix.yaml but NOT wired
  # into the adapter yet -- no ONT fixture exists to validate against.

# reference database / phylum for AAFTF sourpurge (sourmash LCA) contamination
# purge; the adapter overrides this per dataset (folder_id prefix), matching
# adapters/aaftf/run.sh's PHYLA lookup.
aaftf_db: "/bigdata/stajichlab/shared/lib/AAFTF_DB"
phylum: ""

sort:
  min_contig_len: 500

threads: 8
memory_gb: 32
