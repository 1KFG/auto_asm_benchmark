# Dataset registry: short GCS folder id <-> full dataset_id <-> uri
# Schema: schema/registry.schema.json
# Held on the HPCC local host and mirrored into gs://stajichlab-asm-benchmarking/datasets/
# Names are informative, NOT the source of truth; the full dataset_id is the source of truth.
# seed_root recorded for simulated units (from source_reads.seed); real units have no seed.
schema_version: "1.0"
testset_version: "2026.08.1"

